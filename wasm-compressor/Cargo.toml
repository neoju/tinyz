[package]
name = "wasm-compressor"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
imagequant = "4"
js-sys = "0.3"
png = "0.17"
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
